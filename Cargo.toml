[package]
name = "tui-shim"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
gtk4 = { version = "0.11.5", optional = true, features = ["v4_12"] }
include_dir = "0.7.4"
libadwaita = { version = "0.9.2", optional = true, features = ["v1_5"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
ureq = "3.4.2"

[features]
default = ["gui"]
gui = ["dep:gtk4", "dep:libadwaita"]
